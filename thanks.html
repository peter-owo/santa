<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#123d35">
  <title>卡片已送出・文化幣花不掉的聖誕老公公許願池</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,#477665 0,transparent 24%),radial-gradient(circle at 90% 85%,#315d4f 0,transparent 30%),#123d35;color:#173d35;font-family:system-ui,'Noto Sans TC',sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:#fff9e9;border-radius:28px;padding:44px 35px;text-align:center;box-shadow:0 15px 0 #dcebdc,0 28px 55px #092b2666;position:relative}
    .card:before{content:'';position:absolute;inset:15px;border:2px dashed #e2b490;border-radius:19px;pointer-events:none}.icon{font-size:70px;line-height:1.2}h1{font-size:clamp(30px,7vw,44px);margin:12px 0;color:#c7473d}p{font-size:17px;line-height:1.8;color:#4e6e61;margin:0 auto 25px;max-width:390px}a{display:inline-block;background:#d94c3f;color:#fff;text-decoration:none;font-weight:900;border-radius:14px;padding:13px 28px;box-shadow:0 6px 0 #a8322e}a:focus-visible{outline:3px solid #f2ad3a;outline-offset:4px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">💌</div>
    <h1>卡片已送出！</h1>
    <p>你的卡片和圖片已提交寄送。若收件者沒有收到，請檢查垃圾郵件。</p>
    <a href="./">再寫一張</a>
  </main>
</body>
</html>
